third_party_clients:
  note: >-
    NOT Infer packages. These are third-party libraries Infer has tested against its endpoint and
    pinned by exact version in its published compatibility record (checked 2026-08-11). Recorded
    because for this provider they take the place of an SDK, and because the pinning is itself the
    integration contract.
  source: https://infer.flow7.org/compatibility
  clients:
    - name: Codex CLI
      version_tested: 0.146.0
      registry: n/a
      integration: custom model_provider block in ~/.codex/config.toml, wire_api = "responses"
      docs: https://infer.flow7.org/integrations/codex
    - name: OpenCode
      version_tested: 1.18.16
      registry: n/a
      integration: custom provider in opencode.json via npm @ai-sdk/openai
      docs: https://infer.flow7.org/integrations/opencode
    - name: Pydantic AI
      version_tested: 2.27.1
      registry: pypi
      integration: OpenAIResponsesModel through a custom OpenAIProvider
      docs: https://infer.flow7.org/integrations/pydantic-ai
    - name: langchain-openai
      version_tested: 1.4.3
      registry: pypi
      integration: ChatOpenAI with a custom base URL and use_responses_api=True
      docs: https://infer.flow7.org/integrations/langchain
    - name: Vercel AI SDK
      version_tested: 7.0.59
      companion: '@ai-sdk/openai 4.0.37'
      registry: npm
      integration: createOpenAI with a custom base URL and explicit .responses()
      docs: https://infer.flow7.org/integrations/vercel-ai-sdk
  caveat: >-
    Infer states in every cell that a working custom base URL "is not a native integration,
    certification, or supplier attestation", and that Infer is not a first-class provider in
    LangChain, Pydantic AI or the AI SDK.
