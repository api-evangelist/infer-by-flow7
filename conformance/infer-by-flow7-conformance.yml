supply_chain_disclosure:
  supplier_identity_in_api: private
  api_contract: >-
    relay.provider_disclosed is a const false in the OpenAPI schema; the serving supplier is never
    returned on a response, and Infer states it does not attest an upstream provider identity.
  named_in_subprocessor_notice: true
  named_gateways:
    - name: OpenRouter, Inc.
      role: Gateway for Official API / First-Party Endpoint routes
      source: https://infer.flow7.org/subprocessors
    - name: Havenbyte LLC d/b/a ModelFlare
      role: Gateway for Low Cost, Balanced, and Stable routes
      source: https://infer.flow7.org/subprocessors
    - name: Stripe, Inc. / Sold through Link, LLC
      role: Hosted Checkout, payment processing, merchant of record, tax, refunds, disputes
      source: https://infer.flow7.org/subprocessors
    - name: Plus Five Five, Inc. (Resend)
      role: Transactional email
      source: https://infer.flow7.org/subprocessors
    - name: Google LLC
      role: Optional Google OAuth console login
      source: https://infer.flow7.org/subprocessors
    - name: Cloudflare, Inc.
      role: DNS, CDN, edge security, bot/rate protection
      source: https://infer.flow7.org/subprocessors
  note: >-
    Recorded because the two facts sit in tension and both are true. The runtime contract discloses no
    supplier and Infer markets the pool as opaque; the legally binding Subprocessor Notice
    nevertheless names the two ROUTING GATEWAYS by legal entity and maps each to specific price
    options. The model labs behind those gateways remain undisclosed. Anyone reading only the API
    would conclude the supply chain is fully private.
