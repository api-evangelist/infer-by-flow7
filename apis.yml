name: Infer by Flow7
description: >-
  A single Responses-compatible inference API that fronts multiple model families through a private, opaque supplier
  pool. Public paid beta offering a prepaid-wallet billing model, locked prices, spending limits, and per-call receipts
  for accountable coding-agent inference. Four operations — two of them unauthenticated — cover a machine-readable
  price catalog, per-model route status with p95 latency, an authenticated selector list, and the Responses endpoint
  itself. Distinguished by an unusually legible commercial surface: the full rate card, including per-tier margin
  floors and dated market-reference discounts, is served as JSON without a key, and every completed request returns a
  receipt with the locked price version and the exact charge.
