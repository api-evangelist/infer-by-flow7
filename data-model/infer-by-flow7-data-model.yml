observations:
  - >-
    The public data model has no customer, workspace, key, wallet, transaction or receipt entity —
    all of which demonstrably exist in the product (they appear in the docs, the Terms and Route Note
    005's ledger reconciliation). Everything commercial lives behind the console, not the API.
  - >-
    The requested `model` and the served class are deliberately different fields. Response.model
    echoes the requested selector; relay.resolved_model_class names what ran. For a dynamic selector
    like infer/auto/code:stable these differ by design.
  - >-
    relay.tier uses the wire vocabulary (economy | balanced | priority | official) while the selector
    uses the customer vocabulary (:low-cost | :balanced | :stable | :official). Two of the four do
    not match by string.
