funding:
  first_funding_minimum_usd: 20
  reload_minimum_usd: 50
  processor: Stripe-hosted Checkout; Sold through Link, LLC is merchant of record for Stripe Managed Payments
  infer_checkout_fee: none
  tax: may be added separately by the merchant of record
  credit_availability: after payment is confirmed
  source: https://infer.flow7.org/docs and https://infer.flow7.org/terms
sandbox_credit:
  amount_usd: 0.05
  type: one-time simulated
  cash_value: none
  usable_for_live: false
  source: https://infer.flow7.org/docs
  detail: sandbox/infer-by-flow7-sandbox.yml
charging_mechanics:
  reservation: Maximum estimated cost is held before the request starts.
  settlement: Actual amount charged on completion; the unused remainder is returned to the wallet immediately.
  receipt: Every request produces a receipt_id and a customer_cost_usd in the response relay block.
  cache_pricing: >-
    Three separate published rates per selector — input_per_million_usd,
    cached_input_per_million_usd and cache_write_per_million_usd — plus a request_usd component.
  price_versioning: >-
    Each tier carries a price_version string. Infer's Terms state the recorded price version controls
    an accepted request, so a mid-flight price change cannot reprice work already admitted.
disclosed_margin_fields:
  present: true
  fields: [minimum_margin, target_contribution_margin, retry_budget]
  note: >-
    Worth flagging as a market observation, not a criticism — Infer publishes its own margin floor and
    target contribution margin per selector in the same unauthenticated document as the customer
    price. Almost no commercial API in the catalog exposes this.
market_reference_pricing:
  present: true
  note: >-
    Each tier embeds a market block naming the reference lab, that lab's list price, a dated as_of, a
    source_url, and the computed discount percentages against it. Infer therefore publishes its own
    competitive comparison in machine-readable form.
enterprise_contact_only: false
refund_policy:
  url: https://infer.flow7.org/refunds
  version: '2026-08-08'
  summary: >-
    14-day refund of unused, settled paid credit from the funding transaction. Consumed inference is
    generally final. Refunds return only to the original payment method.
