source: >-
  https://infer.flow7.org/api/public/catalog (HTTP 200, application/json, machine-readable price
  catalog read live 2026-08-11), corroborated by https://infer.flow7.org/docs and
  https://infer.flow7.org/refunds. There is no /pricing page — it 404s; the catalog endpoint IS the
  pricing page.
description: >-
  Infer sells no subscription tiers. It sells prepaid wallet credit against per-token prices that are
  published as a machine-readable document, versioned per price, and locked to a request before it
  runs. The "plans" a buyer chooses between are four PRICE OPTIONS on each model selector, not
  account plans. This is a genuinely unusual and unusually legible commercial surface: the full rate
  card, including per-tier margin floors and retry budgets, is served unauthenticated as JSON.
billing_model: prepaid-wallet (metered, usage-based, no subscription)
